
name: Build C# project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on .NET 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Find and build project
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path . -Recurse -File |
            Where-Object {
              ($_.Name -like '*.sln' -or $_.Name -like '*.slnx') -and
              $_.FullName -notmatch '[\\/](\.git|\.vs|bin|obj)[\\/]'
            } |
            Select-Object -First 1

          if ($solution) {
            dotnet build $solution.FullName --configuration Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          else {
            $project = Get-ChildItem -Path . -Recurse -Filter *.csproj -File |
              Where-Object {
                $_.FullName -notmatch '[\\/](\.git|\.vs|bin|obj)[\\/]'
              } |
              Select-Object -First 1

            if (-not $project) {
              throw "Не найден файл .sln, .slnx или .csproj"
            }

            dotnet build $project.FullName --configuration Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
